[package]
name = "scs-quantum"
version = "0.3.0"
edition = "2021"
description = "SCS (Space Computing System) hardverfüggetlen kvantumhíd: frekvencialapú WavePacket-kódolás és visszafejtés"
license = "MIT"
# A `readme` a crate könyvtárán BELÜL legyen: a `cargo package` a csomag
# gyökeréből másol, ezért a "../README.md" útvonal ott nem található, és
# a csomagépítés elhasalna rajta.
readme = "README.md"
keywords = ["quantum", "encoding", "wave-packet", "interference"]
categories = ["science", "algorithms"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
